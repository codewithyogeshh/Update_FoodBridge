name: Build Android APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'pubspec.yaml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > gc-licenses.log 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" > android-sdk.log 2>&1 || true

      - name: Get packages
        run: flutter pub get 2>&1 | tee pub-get.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FoodBridge 1.0.0 - Android APK
          body: |
            Installable Android build of FoodBridge (Flutter + Supabase).

            Download `app-release.apk` and open it on your phone. Android will ask you to allow installing from this source once.
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

      - name: Save failure log
        if: failure()
        run: |
          set -e
          mkdir -p /tmp/ci
          cp --preserve=all build.log pub-get.log android-sdk.log gc-licenses.log /tmp/ci/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/ci/* . 2>/dev/null || true
          git add -f *.log
          git commit -m "ci: apk build failure log"
          git push -f origin ci-logs
