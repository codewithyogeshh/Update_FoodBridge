name: Sync browser demo assets

on:
  push:
    paths:
      - '.demo-sync-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployed demo assets
        run: |
          set -euo pipefail
          base="https://foodbridge-live-demo-thmc5n.freebuff.site"
          mkdir -p demo
          curl -fsSL "$base/" -o demo/index.html
          curl -fsSL "$base/app.css?v=8" -o demo/app.css
          curl -fsSL "$base/app.js?v=8" -o demo/app.js
          echo "08e7e351843849f5576eea4c2e632bae4040d5096f91e4266edd6d831b1d6275  demo/index.html" | sha256sum -c -
          echo "5e5d80c0dcbb5c28a12a1f26c1102e126f37896b8452b900b47df471a84ffdb0  demo/app.css" | sha256sum -c -
          echo "877f390f0c0c4d2cda91f678304a3e3c0363715fa0bb8f58b1ff70f49ca14e51  demo/app.js" | sha256sum -c -

      - name: Commit demo sources and clean up
        run: |
          set -euo pipefail
          git config user.name "Yogesh Chavan"
          git config user.email "yogeshbhai0755@gmail.com"
          git rm -q .github/workflows/demo-sync.yml .demo-sync-trigger
          git add demo
          git commit -m "feat(demo): add browser demo matching the deployed live site" -m "Generated with Codebuff 🤖" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
